# ==============================================================================
# E-Commerce Big Data Capstone – Shared Configuration Template
# Copy to configs/config.yaml on each VM, then adjust VM-specific values.
# DO NOT commit config.yaml – it is listed in .gitignore.
# ==============================================================================

app:
  name: "ecommerce-bigdata-capstone"
  environment: "development"          # development | staging | production
  log_level: "INFO"

# -----------------------------------------------------------------------------
# Apache Spark
# Adjust driver_memory / executor_memory to match the VM hardware.
# session_timezone MUST map to spark.sql.session.timeZone=UTC at runtime.
# -----------------------------------------------------------------------------
spark:
  master: "local[*]"
  app_name: "EcommerceClickstreamPipeline"
  driver_memory: "4g"                 # Sample value – tune per VM
  executor_memory: "4g"               # Sample value – tune per VM
  warehouse_dir: "spark-warehouse"
  shuffle_partitions: 8
  session_timezone: "UTC"
  log_level: "WARN"

# -----------------------------------------------------------------------------
# Apache Kafka
# Topic names must be confirmed with the S2 data contract / B1 implementation.
# Do NOT hardcode broker IPs in this template; set them in config.yaml.
# -----------------------------------------------------------------------------
kafka:
  bootstrap_servers:
    - "localhost:9092"
  topics:
    clickstream_raw: "ecommerce.clickstream.raw"
    clickstream_alerts: "ecommerce.clickstream.alerts"
  consumer:
    group_id: "ecommerce-capstone-consumer-group"
    auto_offset_reset: "latest"
  producer:
    acks: "1"
    retries: 3
    playback_speed_multiplier: 1.0

# -----------------------------------------------------------------------------
# Local filesystem paths – NOT HDFS
# Used for small temporary data and result files on the developer machine.
# -----------------------------------------------------------------------------
storage:
  raw_data_dir: "data/raw"
  processed_data_dir: "data/processed"
  checkpoint_dir: "checkpoint"
  benchmark_dir: "results/benchmark"
  metrics_dir: "results/metrics"
  figures_dir: "results/figures"

# -----------------------------------------------------------------------------
# HDFS – logical paths shared between VM-A and VM-B
# Both VMs use the same path convention but run independent NameNodes.
# Do NOT hardcode a NameNode address here; rely on each VM's fs.defaultFS.
# -----------------------------------------------------------------------------
hdfs:
  raw:
    ecommerce_events: "/data/raw/ecommerce_events"

  curated:
    events_cleaned: "/data/curated/events_cleaned"
    invalid_events: "/data/curated/_quarantine/invalid_events"

  analytics:
    conversion_funnel: "/data/analytics/conversion_funnel"
    session_summary: "/data/analytics/session_summary"
    product_performance: "/data/analytics/product_performance"

  streaming:
    events: "/data/streaming/events"
    aggregations: "/data/streaming/aggregations"
    checkpoints: "/data/streaming/checkpoints"

  ml:
    session_features: "/data/ml/features/session_features"
    train: "/data/ml/datasets/train"
    test: "/data/ml/datasets/test"
    models: "/data/ml/models"
    evaluation: "/data/ml/evaluation"

  metadata:
    manifests: "/data/metadata/manifests"
    quality_reports: "/data/metadata/quality_reports"

# -----------------------------------------------------------------------------
# Apache Hive
# Table names retained from initial setup; confirm against S2 / A4.
# -----------------------------------------------------------------------------
hive:
  database: "ecommerce_db"
  table_events: "fact_events"
  table_sessions: "dim_sessions"
  table_funnel: "agg_funnel_metrics"

# -----------------------------------------------------------------------------
# Spark MLlib
# prediction_point_n and time-split boundaries are TBD – leave null until
# the team finalises them based on A2 exploratory analysis.
#
# NOTE: The original config used "train_ratio: 0.8" (random split).
#       Code on the ml-model branch may still reference train_ratio.
#       Verify compatibility before removing that key from config.yaml.
# -----------------------------------------------------------------------------
ml:
  target_column: "is_purchased"
  prediction_point_n: null             # N events – TBD
  split_strategy: "time_based"
  train_end_utc: null                  # yyyy-MM-dd – TBD
  validation_end_utc: null             # yyyy-MM-dd – TBD
  random_seed: 42
  cv_folds: 3
  model_save_path: "/data/ml/models"
  sample_csv: "data/raw/sample_nov_1pct.csv"
  session_features_path: "data/processed/ml/session_features"
  model_path: "data/processed/ml/lr_model"
  metrics_path: "results/metrics/lr_metrics.json"
  k_events: 5
  split:
    train: 0.70
    val: 0.15
    test: 0.15
  lr:
    max_iter: 50
    reg_param: 0.01
  threshold_grid:
    start: 0.05
    stop: 0.95
    step: 0.01
